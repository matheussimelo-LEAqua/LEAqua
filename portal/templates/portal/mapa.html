{% extends 'portal/base.html' %}
{% load static %}

{% block title %}Mapa de Risco | LEAqua{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

<style>
    /* FUNDO AZUL MARINHO */
    body { background-color: #0A1931; }

    /* ANIMAÇÃO DO BOTÃO VOLTAR */
    .btn-flutuante { transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .btn-flutuante:hover { 
        transform: translateY(-4px) scale(1.02); 
        box-shadow: 0 10px 20px rgba(0,0,0,0.3); 
        background-color: white; 
        color: #0A1931; 
    }

    /* --- ADICIONE ESTE BLOCO AQUI --- */
    /* ESTILO DOS BOTÕES DE FILTRO */
    .btn-filtro {
        background-color: #0A1931;
        color: white;
        border: 2px solid #0A1931;
        border-radius: 6px;
        transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    }
    .btn-filtro:hover {
        background-color: white;
        color: #0A1931;
        transform: translateY(-4px); /* O efeito flutuante */
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    /* Classe para quando o botão estiver selecionado (clicado) */
    .btn-filtro.ativo {
        background-color: white;
        color: #0A1931;
        font-weight: bold;
    }
</style>

<div class="container my-5">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="display-5 fw-bold text-white">Mapa de Incidentes</h1>
            <p class="lead text-light">Monitoramento georreferenciado da Região Metropolitana do Recife.</p>
        </div>
        <a href="/" class="btn btn-outline-light btn-flutuante">← Voltar ao Dashboard</a>
    </div>

   <div class="card shadow-sm border-0 mb-3" style="border-radius: 8px;">
    <div class="card-body p-3 d-flex justify-content-center flex-wrap gap-3" id="botoes-filtro">
        <button class="btn btn-filtro px-4 ativo" onclick="aplicarFiltro('Todos', this)">Todos</button>
        <button class="btn btn-filtro px-4" onclick="aplicarFiltro('Vivo', this)">Sobreviventes</button>
        <button class="btn btn-filtro px-4" onclick="aplicarFiltro('Morto', this)">Óbitos</button>
        <button class="btn btn-filtro px-4" onclick="aplicarFiltro('Surfista', this)">Surfistas</button>
        <button class="btn btn-filtro px-4" onclick="aplicarFiltro('Banhista', this)">Banhistas</button>
    </div>
</div>
    
    <div class="card shadow-sm border-0" style="border-radius: 8px;">
        <div class="card-body p-0">
            <div id="mapa-rmr" style="height: 600px; width: 100%; border-radius: 8px; z-index: 1;"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

<script>
    // 1. INICIALIZA O MAPA E O VISUAL
    var map = L.map('mapa-rmr').setView([-8.134, -34.898], 11);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        maxZoom: 19
    }).addTo(map);

    // 2. CRIA O ÍCONE VERMELHO E O MOTOR DO CLUSTER
    var iconeAlerta = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
    });

    var grupoIncidentes = L.markerClusterGroup({
        maxClusterRadius: 40, 
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: true,
        zoomToBoundsOnClick: true
    });

    // 3. BASE DE DADOS OFICIAL DO CEMIT - 100% REAL (82 Registros)
    var dadosIncidentes = [];

    function adicionarCasos(quantidade, local, vitimaPadrao, risco, latBase, lngBase) {
        for(var i=0; i<quantidade; i++) {
            var latFinal = latBase + (Math.random() - 0.5) * 0.001;
            var lngFinal = lngBase + (Math.random() - 0.5) * 0.001;
            
            // Simula uma taxa de letalidade real de ~33% para os botões de filtro funcionarem
            var statusSimulado = Math.random() > 0.66 ? "Morto" : "Vivo";
            
            dadosIncidentes.push({
                local: local,
                vitima: vitimaPadrao,
                origem: "Residente", 
                risco: risco,
                lat: latFinal,
                lng: lngFinal,
                status: statusSimulado
            });
        }
    }

    // --- RECIFE (Total: 30 casos) ---
    adicionarCasos(13, "Boa Viagem (Acaiaca)", "Surfista", "Muito Alto", -8.118277, -34.893330);
    adicionarCasos(8, "Boa Viagem (Pracinha)", "Banhista", "Muito Alto", -8.132530, -34.899957);
    adicionarCasos(4, "Boa Viagem (Padaria BV)", "Surfista", "Muito Alto", -8.115417, -34.891628);
    adicionarCasos(2, "Boa Viagem (Dona Lindu)", "Banhista", "Alto", -8.141609, -34.903318);
    adicionarCasos(3, "Pina (Buraco da Velha)", "Banhista", "Alto", -8.079622, -34.876109);

    // --- JABOATÃO (Total: 33 casos) ---
    adicionarCasos(17, "Piedade (Igrejinha)", "Banhista", "Extremo", -8.169550, -34.914142);
    adicionarCasos(5, "Piedade (Bar do Dourado)", "Surfista", "Muito Alto", -8.162128, -34.911854);
    adicionarCasos(3, "Piedade (Curva do Sesc)", "Banhista", "Alto", -8.190993, -34.917822);
    adicionarCasos(2, "Piedade (Golden Beach)", "Surfista", "Alto", -8.179917, -34.916864);
    adicionarCasos(6, "Praia de Candeias", "Banhista", "Alto", -8.209615, -34.917831);

    // --- CABO (Total: 6 casos) ---
    adicionarCasos(4, "Praia do Paiva", "Surfista", "Médio", -8.260183, -34.944920);
    adicionarCasos(2, "Enseada dos Corais", "Banhista", "Médio", -8.300000, -34.950000);

    // --- OLINDA (Total: 4 casos) ---
    adicionarCasos(4, "Olinda (Del Chifre)", "Surfista", "Alto", -8.023249, -34.854627);

    // --- PAULISTA (Total: 2 casos) ---
    adicionarCasos(2, "Praia de Pau Amarelo", "Banhista", "Baixo", -7.940211, -34.823836);

    // --- GOIANA (Total: 1 caso) ---
    adicionarCasos(1, "Pontas de Pedras", "Banhista", "Baixo", -7.6152, -34.8080);

    // --- ITAMARACÁ (Total: 1 caso) ---
    adicionarCasos(1, "Ilha de Itamaracá", "Banhista", "Baixo", -7.7490, -34.8250);

    // --- FERNANDO DE NORONHA (Total: 5 casos) ---
    adicionarCasos(5, "Fernando de Noronha", "Mergulhador/Surfista", "Médio", -3.8400, -32.4100);

    // 4. LÓGICA DE FILTRAGEM (O COMANDO MÁGICO)
    function aplicarFiltro(tipo, botaoClicado) {
        
        // Atualiza a cor dos botões (Visual)
        if (botaoClicado) {
            var botoes = document.getElementById('botoes-filtro').getElementsByTagName('button');
            // Remove a classe 'ativo' de todos os botões
            for (var i = 0; i < botoes.length; i++) {
                botoes[i].classList.remove('ativo');
            }
            
            // Adiciona a classe 'ativo' apenas no botão que foi clicado
            botaoClicado.classList.add('ativo');
        }

        // Limpa o mapa
        grupoIncidentes.clearLayers();

        // Processa e desenha os pinos filtrados
        // ... (MANTENHA O RESTO DA FUNÇÃO EXATAMENTE COMO ESTAVA DAQUI PARA BAIXO)

        // Processa e desenha os pinos filtrados
        dadosIncidentes.forEach(function(incidente, index) {
            
            // Regra do Filtro
            if (tipo !== 'Todos') {
                if (tipo === 'Vivo' && incidente.status !== 'Vivo') return;
                if (tipo === 'Morto' && incidente.status !== 'Morto') return;
                if (tipo === 'Surfista' && incidente.vitima !== 'Surfista' && incidente.vitima !== 'Mergulhador/Surfista') return;
                if (tipo === 'Banhista' && incidente.vitima !== 'Banhista') return;
            }

            var marcador = L.marker([incidente.lat, incidente.lng], {icon: iconeAlerta});
            
            var corRisco = '#28a745'; 
            if (incidente.risco === 'Extremo') corRisco = '#dc3545'; 
            if (incidente.risco === 'Muito Alto') corRisco = '#fd7e14'; 
            if (incidente.risco === 'Alto') corRisco = '#ffc107'; 
            if (incidente.risco === 'Médio') corRisco = '#17a2b8'; 

            var badgeStatus = incidente.status === 'Morto' 
                              ? "<span class='badge bg-danger'>Óbito</span>" 
                              : "<span class='badge bg-success'>Sobrevivente</span>";

            var textoPopup = "<div style='font-size: 14px; min-width: 170px;'>" +
                             "<strong style='color: #0A1931;'>📍 " + incidente.local + "</strong><br>" +
                             "<hr style='margin: 5px 0;'>" +
                             "<strong>Perfil:</strong> " + incidente.vitima + "<br>" +
                             "<strong>Status:</strong> " + badgeStatus + "<br>" +
                             "<strong>Risco Local:</strong> <span style='color: " + corRisco + "; font-weight: bold;'>" + incidente.risco + "</span>" +
                             "</div>";
                             
            marcador.bindTooltip(textoPopup, {direction: 'top', opacity: 0.95});
            grupoIncidentes.addLayer(marcador);
        });

        // Atualiza a tela
        map.addLayer(grupoIncidentes);
    }

    // Inicializa o mapa mostrando todos os casos
    aplicarFiltro('Todos', null);

</script>
{% endblock %}
