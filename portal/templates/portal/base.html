<!DOCTYPE html>
<html lang="pt-br">
    {% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LEAqua{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section { background-color: #004a99; color: white; padding: 40px 0; border-bottom: 5px solid #ffcc00; }
        footer { background-color: #f8f9fa; margin-top: 50px; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
    /* Efeito flutuante para os links do menu superior */
    .link-flutuante {
        transition: transform 0.3s ease, color 0.3s ease, text-shadow 0.3s ease;
        display: inline-block; /* Necessário para o transform funcionar em links de texto */
    }
    .link-flutuante:hover {
        transform: translateY(-3px); /* Dá o pulinho pra cima */
        color: #0d6efd !important; /* Fica azulzinho (pode mudar se quiser) */
        text-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Cria uma sombra sutil no texto */
    
    }
</style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">LEAqua</a>
            <div class="navbar-nav">
               <a href="/" class="nav-link link-flutuante">Início</a>
               <a href="/especies" class="nav-link link-flutuante">Espécies</a>
               <a href="/mapa" class="nav-link link-flutuante">Mapas</a>
               <a href="/dados" class="nav-link link-flutuante">Dados</a>
            </div>
        </div>
    </nav>
<div class="animate__animated animate__fadeIn">
    {% block content %}
    {% endblock %}
</div>
    <footer class="text-center py-4 border-top">
        <p class="mb-0">&copy; 2026 UFRPE - Projeto LEAqua</p>
    </footer>
    <footer class="mt-auto py-4 bg-white border-top shadow-sm">
        <div class="container text-center">
            <h6 class="text-muted small fw-bold mb-3 letter-spacing">APOIO INSTITUCIONAL E FONTES DE DADOS</h6>
            
            <div class="d-flex justify-content-center align-items-center flex-wrap gap-4">
                <img src="{% static 'img/ufrpe.png' %}" alt="Logo UFRPE" style="height: 60px; object-fit: contain;">
                
                <img src="{% static 'img/facepe.png' %}" alt="Logo FACEPE" style="height: 60px; object-fit: contain;">
                
                <img src="{% static 'img/cemit.png' %}" alt="Logo CEMIT" style="height: 60px; object-fit: contain;">
            </div>
            
            <div class="mt-3">
                <small class="text-muted">
                    © 2026 Portal LEAqua.
                </small>
            </div>
        </div>
    </footer>
</body>
</html>
